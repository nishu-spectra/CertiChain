<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Certificate Details | CertiChain</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">⬡ CertiChain</a>
      <nav>
        <a href="verify.html">Verify</a><a href="explorer.html">Explorer</a>
      </nav>
    </header>

      <div class="page-heading">
        <div>
          <span class="eyebrow">CREDENTIAL RECORD</span>

        </div>

          Use the public verification page to look up a certificate ID and view
          the returned record.
        </p>
        <a class="btn" href="verify.html">Verify certificate</a>
      </section>
    </main>

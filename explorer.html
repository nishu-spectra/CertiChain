<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blockchain Explorer | CertiChain</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html">⬡ CertiChain</a>
      <nav>
        <a href="dashboard.html">Dashboard</a><a href="verify.html">Verify</a
        ><button class="small-btn" onclick="connectWallet()">
          Connect wallet
        </button>
      </nav>
    </header>
    <main class="content-wrap">
      <div class="page-heading">
        <div>
          <span class="eyebrow">PUBLIC LEDGER</span>
          <h1>Blockchain explorer</h1>
          <p class="muted">
            Look up a certificate directly from the deployed CertificateRegistry
            smart contract.
          </p>
        </div>
      </div>
      <section class="panel">
        <div class="search-row">
          <input id="explorerId" placeholder="Certificate ID" /><button
            class="btn"
            onclick="exploreCertificate()"
          >
            Search record
          </button>
        </div>
        <p id="message" class="message"></p>
        <div id="explorerResult"></div>
      </section>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

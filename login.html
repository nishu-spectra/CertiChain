<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | CertiChain</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <header class="topbar">
      <a class="brand" href="index.html">⬡ CertiChain</a>
      <nav><a href="index.html">Home</a><a href="verify.html">Verify</a></nav>
    </header>
    <main class="auth-wrap">
      <section class="panel auth-card">
        <div class="brand-mark">⬡</div>
        <h1>Welcome back</h1>
        <p class="muted">Sign in with your approved institution account.</p>
        <form id="loginForm">
          <label
            >Institution email<input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              required /></label
          ><label
            >Password
            <div class="password-wrapper">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              /><button
                type="button"
                class="password-toggle"
                onclick="togglePassword('password', this)"
                aria-label="Show password"
              >
                Show
              </button>
            </div></label
          ><button class="btn full" type="submit">Login</button>
        </form>
        <p id="message" class="message" role="status" aria-live="polite"></p>
        <p class="muted center">
          New institution? <a href="register.html">Create an account</a>
        </p>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
